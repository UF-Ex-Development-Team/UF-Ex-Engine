- uid: UndyneFight_Ex.SongSystem.WaveConstructor.CreateChart(System.Single,System.Single,System.Single,System.String[])
  commentId: M:UndyneFight_Ex.SongSystem.WaveConstructor.CreateChart(System.Single,System.Single,System.Single,System.String[])
  id: CreateChart(System.Single,System.Single,System.Single,System.String[])
  parent: UndyneFight_Ex.SongSystem.WaveConstructor
  langs:
  - csharp
  - vb
  name: CreateChart(float, float, float, string[])
  nameWithType: WaveConstructor.CreateChart(float, float, float, string[])
  fullName: UndyneFight_Ex.SongSystem.WaveConstructor.CreateChart(float, float, float, string[])
  type: Method
  assemblies:
  - UndyneFight-Ex
  namespace: UndyneFight_Ex.SongSystem
  summary: >-
    String based chart creator, use an empty string for an empty beat.<br />

    Optional Args: "!": No Score, "^": Accelerate, "&lt;": RotateL, "&gt;": RotateR, "*": Tap, "~": Void Sprite, "_": Hold<br />

    Order of parsing: ~*_&lt;&gt;^!<br />

    Direction Args: "R": Random, "D": Different, "+/-x" Add/Sub x to the last dir. , "$x": Fixed on x direction, "Nx": Not x, "Ax": The xth allocated direction<br />

    Optional Color Args: 0-&gt; Blue, 1-&gt; Red, 2-&gt; Green, 3-&gt; Purple<br />

    Optional Rotation Args: 0-&gt; None, 1-&gt; Reverse, 2-&gt; Diagonal<br />

    GB：#xx#yz, Where "xx" means the duration beat, "y" beats direction, "z" means color, replace '#' with '%' if you don't want arrows<br />

    Combinations: "(R)(+0)", NOT "R(+0)"<br />

    Misc: use ' to multiply the speed of the arrow, &lt;&lt; or &gt;&gt; to adjust the current beat (&gt;&gt;0.5 will skip 0.5 beats)<br />

    Use <xref href="UndyneFight_Ex.SongSystem.WaveConstructor.RegisterFunction(System.String%2cSystem.Action)" data-throw-if-not-resolved="false"></xref> or <xref href="UndyneFight_Ex.SongSystem.WaveConstructor.RegisterFunctionOnce(System.String%2cSystem.Action)" data-throw-if-not-resolved="false"></xref> to declare functions to execute them inside here<br />

    For example RegisterFunctionOnce("func", ()=&gt; {});<br />

    "(func)(R)", will invoke the action in "func" and creates an arrow<br />

    "!!X/Y", Each item will last 'Beat / 2X' beats (i.e. X = 2 then 1 beat is 4 items instead of the usual 8) for the next Y beats (If Y is undefined then it will last for the rest of the function)<br />

    You can add arguments in the form of "&lt;Arg1,Arg2...&gt;Action"<br />

    You may use <xref href="UndyneFight_Ex.SongSystem.WaveConstructor.Arguments" data-throw-if-not-resolved="false"></xref> inside the declared action in RegisterFunction(Once) to access them.<br />

    Adding '@' at the end or wrapping it in curly brackets would apply a tag to the arrow, i.e. "$0@E" or "$0{E}" would apply the tag "E" to the arrow
  example: []
  syntax:
    content: public void CreateChart(float Delay, float Beat, float arrowspeed, string[] Barrage)
    parameters:
    - id: Delay
      type: System.Single
      description: The delay for the events to be executed, generally used for preventing spawning immediately within view
    - id: Beat
      type: System.Single
      description: Duration of 8 beats, generally used with <xref href="UndyneFight_Ex.SongSystem.WaveConstructor.BeatTime(System.Single)" data-throw-if-not-resolved="false"></xref>
    - id: arrowspeed
      type: System.Single
      description: The speed of the arrows
    - id: Barrage
      type: System.String[]
      description: The array of strings that contains the barrage
    content.vb: Public Sub CreateChart(Delay As Single, Beat As Single, arrowspeed As Single, Barrage As String())
  overload: UndyneFight_Ex.SongSystem.WaveConstructor.CreateChart*
  nameWithType.vb: WaveConstructor.CreateChart(Single, Single, Single, String())
  fullName.vb: UndyneFight_Ex.SongSystem.WaveConstructor.CreateChart(Single, Single, Single, String())
  name.vb: CreateChart(Single, Single, Single, String())
