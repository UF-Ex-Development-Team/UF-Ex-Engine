  summary: >-
    Storage rules of <xref href="UndyneFight_Ex.IO.SaveInfo" data-throw-if-not-resolved="false"></xref>:

    <p>[] are constants，{} are an array of <xref href="UndyneFight_Ex.IO.SaveInfo.values" data-throw-if-not-resolved="false"></xref>, -&gt;{} are an array of <xref href="UndyneFight_Ex.IO.SaveInfo.Nexts" data-throw-if-not-resolved="false"></xref>, ',' is the separator of data</p>

    <p>Examples are as follows:</p>

    <p>(ChampionShips)-&gt;{div=[string],score=[int],position=[int]}</p>

    <p>PlayerName:[string],VIP:[bool]</p>

    <p>NormalFight-&gt;{(songName):noob=[int],easy=[int],...extreme=[int]}</p>

    <p>Achievements-&gt;{(achievementName):type=[bool],progress=[int]}</p>
