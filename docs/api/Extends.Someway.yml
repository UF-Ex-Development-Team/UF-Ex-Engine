- uid: Extends.Someway.SpecialRhythmCreate(System.Single,System.Single,System.Single,System.String[],System.String[],System.Action[])
  commentId: M:Extends.Someway.SpecialRhythmCreate(System.Single,System.Single,System.Single,System.String[],System.String[],System.Action[])
  id: SpecialRhythmCreate(System.Single,System.Single,System.Single,System.String[],System.String[],System.Action[])
  parent: Extends.Someway
  langs:
  - csharp
  - vb
  name: SpecialRhythmCreate(float, float, float, string[], string[], Action[])
  nameWithType: Someway.SpecialRhythmCreate(float, float, float, string[], string[], Action[])
  fullName: Extends.Someway.SpecialRhythmCreate(float, float, float, string[], string[], System.Action[])
  type: Method
  assemblies:
  - UndyneFight-Ex
  namespace: Extends
  summary: >-
    使用一个特殊的节奏数组,并且支持在定点释放事件。

    规则如下：

    eventsname和events是对应的。例如第二个eventsname对应第二个events。

    GB的创建即

    "G001"，G表示固定方向，第二个字符为方向，第三个字符为颜色，第三个之后的字符表示持续beat拍（默认-5）

    "WR01"，W表示随机方向，第二个字符没有效果，第三个字符为颜色，第三个之后的字符表示持续beat拍（默认-5）

    "/"为空拍,x表示切分拍

    箭头第一个字符-方向 的规则: R 表示随机 D 表示与上次不同 +x 表示上一个方向的 +x方向 -x 表示上一个方向的 -x方向 $x 表示固定某个方向。

    箭头第二个字符-颜色 的规则：0蓝1红。

    箭头第三个字符-旋转type 的规则：0普通1旋转2斜矛。

    箭头修饰字符-箭头效果 的规则：前面加上~表示*1.2速加速，!表示右旋转，@表示左旋转

    箭头组合规则：字符串内加括号表示不仅创建一个箭头,例如"(R)(R1)"。

    PS："R(+0)" ≠ "(R)(+0)",后者才是两个矛叠一块，第一个会无效。
  example: []
  syntax:
    content: >-
      [Obsolete("Use CreateChart()")]

      public static void SpecialRhythmCreate(float beat, float arrowspeed, float starttime, string[] rhythm, string[] eventsname, Action[] events)
    parameters:
    - id: beat
      type: System.Single
      description: 节奏数组的间隔拍，推荐三十二分音符为间隔
    - id: arrowspeed
      type: System.Single
      description: 假如创建出来箭头，那么这个箭头的速度
    - id: starttime
      type: System.Single
      description: 延迟的时间
    - id: rhythm
      type: System.String[]
      description: 节奏数组
    - id: eventsname
      type: System.String[]
      description: 节奏数组内事件的名称
    - id: events
      type: System.Action[]
      description: 节奏数组内的事件
    content.vb: >-
      <Obsolete("Use CreateChart()")>

